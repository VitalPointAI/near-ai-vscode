# Sandbox policy for the agent shell spike (OpenShell policy schema v1).
version: 1
filesystem_policy:
  include_workdir: true          # /sandbox (holds only the uploaded copy)
  read_only: [/usr, /lib, /lib64, /bin, /etc, /proc, /dev/urandom]
  read_write: [/tmp, /dev/null]
  # Not listed, so not reachable: /opt (decoy key), /home, /root, /run, /var, ...
landlock:
  compatibility: hard_requirement
process:
  run_as_user: "1000"
  run_as_group: "1000"
network_policies:
  npm_registry_read:
    endpoints:
      - host: registry.npmjs.org
        port: 443
        protocol: rest
        access: read-only
        enforcement: enforce
    binaries:
      - path: /usr/local/bin/node
