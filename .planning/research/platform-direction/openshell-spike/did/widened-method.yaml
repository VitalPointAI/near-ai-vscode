# DRAFT. Sandbox section of a CHILD (worker) DID, narrowed from the parent:
# no /tmp write, npm read-only, inference limited to chat completions.
version: 1
filesystem_policy:
  include_workdir: false
  read_only: [/usr, /lib, /lib64, /bin, /etc, /proc, /dev/urandom]
  read_write: [/sandbox, /dev/null]
landlock:
  compatibility: hard_requirement
process:
  run_as_user: "1000"
  run_as_group: "1000"
network_policies:
  npm_registry:
    endpoints:
      - host: registry.npmjs.org
        port: 443
        protocol: rest
        access: full
        enforcement: enforce
    binaries:
      - path: /usr/local/bin/node
  nearai_inference:
    endpoints:
      - host: cloud-api.near.ai
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: POST, path: /v1/chat/completions }
    binaries:
      - path: /usr/local/bin/node
