# DRAFT. Prover test case (openshell-spike.md section 6): child-sandbox.yaml, the narrowed child, with one change
# that WIDENS it past the parent: /etc moves from read-only to read-write. The prover answered unsupported.
version: 1
filesystem_policy:
  include_workdir: false
  read_only: [/usr, /lib, /lib64, /bin, /proc, /dev/urandom]
  read_write: [/sandbox, /dev/null, /etc]
landlock:
  compatibility: hard_requirement
process:
  run_as_user: "1000"
  run_as_group: "1000"
network_policies:
  npm_registry:
    endpoints:
      - host: registry.npmjs.org
        port: 443
        protocol: rest
        access: read-only
        enforcement: enforce
    binaries:
      - path: /usr/local/bin/node
  nearai_inference:
    endpoints:
      - host: cloud-api.near.ai
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: POST, path: /v1/chat/completions }
    binaries:
      - path: /usr/local/bin/node
