# Required checks for every PR into main. The job names (lint, test, e2e, release-content, audit,
# secret-scan, relay, hub, docs, deploy) are the branch protection's required status checks: do not rename them
# without updating branch protection, CI_CHECKS in scripts/lib/workflow.mjs and
# docs/development-workflow.md in the same PR.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to the same PR cancels the run it supersedes. Every other run (pushes to main, runs
# started by hand) gets a group of its own, so it is never cancelled or replaced while queued and
# every commit on main gets a complete result.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: '24'

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - name: Compliance fit check (every resource has a reviewed entry in compliance/resources.json)
        run: node scripts/resource-check.mjs

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Run tests and write the evidence report
        env:
          NEAR_AI_TEST_REPORT: test-report-root.ndjson
        run: npm test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        continue-on-error: true
        with:
          name: test-report-root
          path: test-report-root.ndjson
          if-no-files-found: warn

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Cache key for the VS Code test download (changes weekly)
        id: week
        run: echo "key=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .vscode-test
          key: vscode-test-${{ runner.os }}-${{ steps.week.outputs.key }}
          restore-keys: vscode-test-${{ runner.os }}-
      - name: Install xvfb if the runner lacks it
        run: command -v xvfb-run >/dev/null || (sudo apt-get update && sudo apt-get install -y xvfb)
      - run: npm ci
      - run: npm run compile
      - name: Run the extension in a real VS Code
        run: env -u ELECTRON_RUN_AS_NODE xvfb-run -a -s "-screen 0 1920x1080x24" node dist/test/e2e/run.js

  release-content:
    name: release-content
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Package the VSIX and check what it contains
        run: npm run verify:release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix-${{ github.sha }}
          path: '*.vsix'
          retention-days: 7
          if-no-files-found: error

  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      # Reads the lockfile only; nothing is installed or run.
      - run: npm audit --omit=dev --audit-level=high

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Scan tracked files and every commit this change adds
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            node scripts/secret-scan.mjs --range "$PR_BASE..$PR_HEAD"
          elif [ "$EVENT" = "push" ] && [ -n "$PUSH_BEFORE" ] && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            node scripts/secret-scan.mjs --range "$PUSH_BEFORE..$GITHUB_SHA"
          else
            node scripts/secret-scan.mjs
          fi

  # The documentation site (docs-site/) is its own workspace with its own lockfile. The job audits it
  # and builds it; the build fails on a broken link or anchor, so a doc change that breaks the site
  # fails here. The install runs no dependency scripts. It is not yet a required check: adding it to
  # the branch protection is the owner's step (docs/development-workflow.md, section 8).
  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      # 48.1-01 (D-09): the generated blocks of the hosted SA&A documents match their sources, and the exchange register names every deploy
      # module that calls one of the six signing helpers (signFile, verifySignedFile, signBlob, verifyBlob, signImage, verifyImage). Node
      # alone: the command imports only Node built-ins.
      - name: Check the generated blocks of the hosted SA&A documents
        working-directory: .
        run: node compliance/src/cli.ts hosted-docs --check
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - name: Test the documentation site
        run: node ../scripts/run-tests.mjs test/*.test.mjs
      - name: Build the site and check every link
        env:
          NEAR_AI_COMPLIANCE_OVERLAY_DIR: ../compliance/test/fixtures/overlay
        run: |
          npm run build
          node scripts/check-build-isolation.mjs --markers ../compliance/test/fixtures/overlay/markers.txt --dir build --dir static

  # The messaging relay (relay/) is its own package on its own Node version, so it gets its own job.
  # The extension's jobs above stay on NODE_VERSION. The install runs no dependency scripts.
  relay:
    name: relay
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The detection step below reads the base commit and main's history, not only this commit.
          fetch-depth: 0
      # A hotfix branch cut from a release tag older than the relay has no relay/ folder. The job then
      # passes without running anything else, so the required relay check does not block the hotfix,
      # but only when all of these hold: the branch is hotfix/x.y.z, relay/package.json is not on this
      # commit, and it is not on the commit this change starts from either (the PR's base commit, or
      # for a run started by hand the commit where the branch left main). So a change that deletes the
      # relay fails the job on every branch, hotfix included, and a push to main never skips. Every
      # later step is guarded by this output. The branch name and base commit come in through env,
      # never pasted into the script.
      - name: Check that this commit has the relay
        id: has_relay
        working-directory: .
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -f relay/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base=""
          if [ "$EVENT" = "pull_request" ]; then
            base="$PR_BASE"
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            base="$(git merge-base HEAD refs/remotes/origin/main 2>/dev/null || true)"
          fi
          if [[ "$BRANCH" =~ ^hotfix/[0-9]+\.[0-9]+\.[0-9]+$ ]] && [ -n "$base" ] \
            && git cat-file -e "$base^{commit}" 2>/dev/null && ! git cat-file -e "$base:relay/package.json" 2>/dev/null; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=relay checks skipped::relay/package.json is neither on this commit of $BRANCH nor on its base commit (a hotfix from a release older than the relay), so the relay checks were skipped."
          else
            echo "::error title=relay missing::relay/package.json is not on this commit. Only a hotfix/x.y.z branch from a release older than the relay, whose base commit has no relay either, may skip the relay checks."
            exit 1
          fi
      # The relay's refusal of an older Node is tested with a real Node 24 (relay/test/workspace.test.ts). Install it first and keep its
      # path; the 26.13.1 install after it comes first on PATH for every later step.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.has_relay.outputs.present == 'true'
        with:
          node-version: '24'
      - name: Keep Node 24 for the relay's older-Node refusal tests
        if: steps.has_relay.outputs.present == 'true'
        run: echo "NEAR_AI_RELAY_OLD_NODE=$(command -v node)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.has_relay.outputs.present == 'true'
        with:
          node-version: '26.13.1'
          cache: npm
          cache-dependency-path: relay/package-lock.json
      - if: steps.has_relay.outputs.present == 'true'
        run: npm ci --ignore-scripts
      - if: steps.has_relay.outputs.present == 'true'
        run: npm audit --omit=dev --audit-level=high
      - if: steps.has_relay.outputs.present == 'true'
        run: npm run lint
      - name: Run relay tests and write the evidence report
        if: steps.has_relay.outputs.present == 'true'
        env:
          NEAR_AI_TEST_REPORT: test-report-relay.ndjson
        run: npm test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.has_relay.outputs.present == 'true' && always()
        continue-on-error: true
        with:
          name: test-report-relay
          path: relay/test-report-relay.ndjson
          if-no-files-found: warn
      - name: Build the relay image and check its hardening
        if: steps.has_relay.outputs.present == 'true'
        run: npm run test:container

  # Your organization's sync hub (hub/) is its own package on its own Node version, built like the relay,
  # so it gets its own job too. The install runs no dependency scripts.
  hub:
    name: hub
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The detection step below reads the base commit and main's history, not only this commit.
          fetch-depth: 0
      # The same hotfix rule as the job above, keyed on hub/package.json: a hotfix/x.y.z branch whose
      # commit and base commit both lack the hub passes without running anything else; any other change
      # without the hub fails, and a push to main never skips. Every later step is guarded by this
      # output. The branch name and base commit come in through env, never pasted into the script.
      - name: Check that this commit has the hub
        id: has_hub
        working-directory: .
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -f hub/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base=""
          if [ "$EVENT" = "pull_request" ]; then
            base="$PR_BASE"
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            base="$(git merge-base HEAD refs/remotes/origin/main 2>/dev/null || true)"
          fi
          if [[ "$BRANCH" =~ ^hotfix/[0-9]+\.[0-9]+\.[0-9]+$ ]] && [ -n "$base" ] \
            && git cat-file -e "$base^{commit}" 2>/dev/null && ! git cat-file -e "$base:hub/package.json" 2>/dev/null; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=hub checks skipped::hub/package.json is neither on this commit of $BRANCH nor on its base commit (a hotfix from a release older than the hub), so the hub checks were skipped."
          else
            echo "::error title=hub missing::hub/package.json is not on this commit. Only a hotfix/x.y.z branch from a release older than the hub, whose base commit has no hub either, may skip the hub checks."
            exit 1
          fi
      # The hub's refusal of an older Node is tested with a real Node 24 (hub/test/workspace.test.ts). Install it first and keep its
      # path; the 26.13.1 install after it comes first on PATH for every later step.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.has_hub.outputs.present == 'true'
        with:
          node-version: '24'
      - name: Keep Node 24 for the hub's older-Node refusal tests
        if: steps.has_hub.outputs.present == 'true'
        run: echo "NEAR_AI_HUB_OLD_NODE=$(command -v node)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.has_hub.outputs.present == 'true'
        with:
          node-version: '26.13.1'
          cache: npm
          cache-dependency-path: hub/package-lock.json
      - if: steps.has_hub.outputs.present == 'true'
        run: npm ci --ignore-scripts
      - if: steps.has_hub.outputs.present == 'true'
        run: npm audit --omit=dev --audit-level=high
      - if: steps.has_hub.outputs.present == 'true'
        run: npm run lint
      - name: Run hub tests and write the evidence report
        if: steps.has_hub.outputs.present == 'true'
        env:
          NEAR_AI_TEST_REPORT: test-report-hub.ndjson
        run: npm test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.has_hub.outputs.present == 'true' && always()
        continue-on-error: true
        with:
          name: test-report-hub
          path: hub/test-report-hub.ndjson
          if-no-files-found: warn
      - name: Build the hub image and check its hardening and its Compose service
        if: steps.has_hub.outputs.present == 'true'
        run: npm run test:container

  # The Sterling Theia workbench (Phase 46, D-10, D-28): install without scripts, audit, lint, unit tests with their report, the image build,
  # and the container suite with Playwright driving that image in Chromium. Not a required check (D-40). The Release workflow signs the
  # image it publishes; this job pushes and signs nothing.
  workbench:
    name: workbench
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        working-directory: workbench
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The detection step below reads the base commit and main's history, not only this commit.
          fetch-depth: 0
      # The hub's hotfix rule, keyed on workbench/package.json: a hotfix/x.y.z branch whose commit and base commit both lack the workbench
      # passes without running anything else; any other change without it fails, and a push to main never skips. The branch name and base
      # commit come in through env, never pasted into the script.
      - name: Check that this commit has the workbench
        id: has_workbench
        working-directory: .
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -f workbench/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base=""
          if [ "$EVENT" = "pull_request" ]; then
            base="$PR_BASE"
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            base="$(git merge-base HEAD refs/remotes/origin/main 2>/dev/null || true)"
          fi
          if [[ "$BRANCH" =~ ^hotfix/[0-9]+\.[0-9]+\.[0-9]+$ ]] && [ -n "$base" ] \
            && git cat-file -e "$base^{commit}" 2>/dev/null && ! git cat-file -e "$base:workbench/package.json" 2>/dev/null; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=workbench checks skipped::workbench/package.json is neither on this commit of $BRANCH nor on its base commit (a hotfix from a release older than the workbench), so the workbench checks were skipped."
          else
            echo "::error title=workbench missing::workbench/package.json is not on this commit. Only a hotfix/x.y.z branch from a release older than the workbench, whose base commit has no workbench either, may skip the workbench checks."
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.has_workbench.outputs.present == 'true'
        with:
          node-version: '26.13.1'
          cache: npm
          cache-dependency-path: workbench/package-lock.json
      - if: steps.has_workbench.outputs.present == 'true'
        run: npm ci --ignore-scripts
      # Blocking at high. zod GHSA-mrhx-c7xc-m3w5 (through @theia/ai-mcp) is fixed by the scoped override in workbench/package.json;
      # the JSON still goes up with the test report.
      - name: Audit the workbench runtime dependencies
        if: steps.has_workbench.outputs.present == 'true'
        run: |
          status=0
          npm audit --omit=dev --audit-level=high --json > workbench-audit.json || status=$?
          node -e 'const a = JSON.parse(require("node:fs").readFileSync("workbench-audit.json", "utf8")); console.log(JSON.stringify(a.metadata?.vulnerabilities ?? a.error ?? {}))'
          exit "$status"
      - if: steps.has_workbench.outputs.present == 'true'
        run: npm run lint
      - name: Run workbench tests and write the evidence report
        if: steps.has_workbench.outputs.present == 'true'
        env:
          NEAR_AI_TEST_REPORT: test-report-workbench.ndjson
        run: npm test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.has_workbench.outputs.present == 'true' && always()
        continue-on-error: true
        with:
          name: test-report-workbench
          path: |
            workbench/test-report-workbench.ndjson
            workbench/workbench-audit.json
          if-no-files-found: warn
      # The default (development) target, from the repository root because the engine bundle reads src/.
      - name: Build the workbench image
        if: steps.has_workbench.outputs.present == 'true'
        working-directory: .
        run: bash .github/retry-registry-auth.sh docker build -f workbench/Dockerfile -t sterling-workbench:ci .
      # The image's supply-chain record (D-31), with the relay image scan's pinned tools: a CycloneDX SBOM, a Grype scan (report-only)
      # and the image ID, written before the tests so a failing test still leaves them.
      - name: Install pinned Syft and Grype
        if: steps.has_workbench.outputs.present == 'true'
        working-directory: .
        run: |
          sh compliance/ci/install-tool.sh syft compliance/out/tools
          sh compliance/ci/install-tool.sh grype compliance/out/tools
          echo "$PWD/compliance/out/tools" >> "$GITHUB_PATH"
      - name: Write the workbench image SBOM
        if: steps.has_workbench.outputs.present == 'true'
        working-directory: .
        run: syft scan sterling-workbench:ci --output cyclonedx-json=compliance/out/workbench-image-sbom.json
      - name: Update the Grype database
        if: steps.has_workbench.outputs.present == 'true'
        working-directory: .
        run: grype db update
      - name: Record fixed high-severity findings in the workbench image
        if: steps.has_workbench.outputs.present == 'true'
        working-directory: .
        continue-on-error: true
        run: grype sbom:compliance/out/workbench-image-sbom.json --only-fixed --fail-on high --output json=compliance/out/workbench-image-scan.json
      - name: Record the workbench image digest
        if: steps.has_workbench.outputs.present == 'true'
        working-directory: .
        run: |
          docker image inspect --format '{{.Id}}' sterling-workbench:ci > compliance/out/workbench-image-digest.txt
          printf '### Workbench image\n\n`%s` (sterling-workbench:ci, not published)\n' "$(cat compliance/out/workbench-image-digest.txt)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.has_workbench.outputs.present == 'true' && always()
        with:
          name: workbench-image-sbom
          path: compliance/out/workbench-image-sbom.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.has_workbench.outputs.present == 'true' && always()
        with:
          name: workbench-image-scan
          path: compliance/out/workbench-image-scan.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.has_workbench.outputs.present == 'true' && always()
        with:
          name: workbench-image-digest
          path: compliance/out/workbench-image-digest.txt
          if-no-files-found: warn
      # Chromium from the pinned Playwright release only (never a download npx would make on its own).
      - name: Install Chromium for the browser tests
        if: steps.has_workbench.outputs.present == 'true'
        run: npx --no-install playwright install --with-deps chromium
      - name: Run the container suite and the browser tests against the built image
        if: steps.has_workbench.outputs.present == 'true'
        env:
          WORKBENCH_TEST_IMAGE: sterling-workbench:ci
        run: npm run test:container

  relay-image-scan:
    name: relay image scan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check that this commit has the relay and scan tools
        id: has_relay_scan
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -f relay/package.json ] && [ -f compliance/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          base=""
          if [ "$EVENT" = "pull_request" ]; then base="$PR_BASE"; elif [ "$EVENT" = "workflow_dispatch" ]; then base="$(git merge-base HEAD refs/remotes/origin/main 2>/dev/null || true)"; fi
          for manifest in relay/package.json compliance/package.json; do
            if [ -f "$manifest" ]; then continue; fi
            if [[ ! "$BRANCH" =~ ^hotfix/[0-9]+\.[0-9]+\.[0-9]+$ ]] || [ -z "$base" ] || git cat-file -e "$base:$manifest" 2>/dev/null; then
              echo "::error::$manifest is missing"; exit 1
            fi
          done
          echo "present=false" >> "$GITHUB_OUTPUT"
      - name: Build the relay image
        if: steps.has_relay_scan.outputs.present == 'true'
        run: bash .github/retry-registry-auth.sh docker build -f relay/Dockerfile -t near-ai-relay:scan .
      - name: Install pinned Syft and Grype
        if: steps.has_relay_scan.outputs.present == 'true'
        run: |
          sh compliance/ci/install-tool.sh syft compliance/out/tools
          sh compliance/ci/install-tool.sh grype compliance/out/tools
          find compliance/out/tools -type f \( -name syft -o -name grype \) -printf '%h\n' | sort -u >> "$GITHUB_PATH"
      - name: Write the relay SBOM
        if: steps.has_relay_scan.outputs.present == 'true'
        run: syft scan near-ai-relay:scan --output cyclonedx-json=compliance/out/relay-image-sbom.json
      - name: Update the Grype database
        if: steps.has_relay_scan.outputs.present == 'true'
        run: grype db update
      - name: Record fixed high-severity findings
        if: steps.has_relay_scan.outputs.present == 'true'
        continue-on-error: true
        run: grype sbom:compliance/out/relay-image-sbom.json --only-fixed --fail-on high --output json=compliance/out/relay-image-scan.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: relay-image-sbom
          path: compliance/out/relay-image-sbom.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: relay-image-scan
          path: compliance/out/relay-image-scan.json
          if-no-files-found: warn

  deploy:
    name: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The detection step below reads the base commit and main's history, not only this commit.
          fetch-depth: 0
      # The same hotfix rule as the hub job, keyed on deploy/charts/charts.lock.json: a hotfix/x.y.z branch whose commit and
      # base commit both lack the deployment stack passes without running anything else; any other change without it fails,
      # and a push to main never skips. Every later step is guarded by this output.
      - name: Check that this commit has the deployment stack
        id: has_deploy
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -f deploy/charts/charts.lock.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base=""
          if [ "$EVENT" = "pull_request" ]; then
            base="$PR_BASE"
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            base="$(git merge-base HEAD refs/remotes/origin/main 2>/dev/null || true)"
          fi
          if [[ "$BRANCH" =~ ^hotfix/[0-9]+\.[0-9]+\.[0-9]+$ ]] && [ -n "$base" ] \
            && git cat-file -e "$base^{commit}" 2>/dev/null && ! git cat-file -e "$base:deploy/charts/charts.lock.json" 2>/dev/null; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=deploy checks skipped::deploy/charts/charts.lock.json is neither on this commit of $BRANCH nor on its base commit (a hotfix from a release older than the deployment stack), so the deploy checks were skipped."
          else
            echo "::error title=deployment stack missing::deploy/charts/charts.lock.json is not on this commit. Only a hotfix/x.y.z branch from a release older than the deployment stack, whose base commit has none either, may skip the deploy checks."
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.has_deploy.outputs.present == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install pinned helm and cosign
        if: steps.has_deploy.outputs.present == 'true'
        run: |
          sh compliance/ci/install-tool.sh helm compliance/out/tools
          sh compliance/ci/install-tool.sh cosign compliance/out/tools
          echo "$PWD/compliance/out/tools/linux-amd64" >> "$GITHUB_PATH"
          echo "$PWD/compliance/out/tools" >> "$GITHUB_PATH"
          echo "HELM=$PWD/compliance/out/tools/linux-amd64/helm" >> "$GITHUB_ENV"
      - name: Check the vendored chart tarballs against the chart lock (offline)
        if: steps.has_deploy.outputs.present == 'true'
        run: node deploy/charts/vendor.mjs --check
      - name: Render every chart offline, check the hardening invariants and write the evidence report
        if: steps.has_deploy.outputs.present == 'true'
        env:
          NEAR_AI_TEST_REPORT: test-report-deploy.ndjson
        run: node scripts/run-tests.mjs deploy/test/*.test.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.has_deploy.outputs.present == 'true' && always()
        continue-on-error: true
        with:
          name: test-report-deploy
          path: test-report-deploy.ndjson
          if-no-files-found: warn

  compliance:
    name: compliance
    if: always()
    needs: [lint, test, e2e, release-content, audit, secret-scan, docs, relay, hub, deploy, relay-image-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check that this commit has the compliance package
        id: has_compliance
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ -f compliance/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            # Only a main push or the documented branch dispatch can produce release evidence.
            if [ "$EVENT" = "push" ] && [ "$BRANCH" = "main" ]; then
              echo "publish_as=main" >> "$GITHUB_OUTPUT"
            elif [ "$EVENT" = "workflow_dispatch" ] && [ "$REF_TYPE" = "branch" ] && [[ "$BRANCH" =~ ^hotfix/[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "publish_as=release" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          base=""
          if [ "$EVENT" = "pull_request" ]; then base="$PR_BASE"; elif [ "$EVENT" = "workflow_dispatch" ]; then base="$(git merge-base HEAD refs/remotes/origin/main 2>/dev/null || true)"; fi
          if [[ "$BRANCH" =~ ^hotfix/[0-9]+\.[0-9]+\.[0-9]+$ ]] && [ -n "$base" ] && ! git cat-file -e "$base:compliance/package.json" 2>/dev/null; then echo "present=false" >> "$GITHUB_OUTPUT"; else echo "::error::compliance/package.json is missing"; exit 1; fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.has_compliance.outputs.present == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: compliance/package-lock.json
      - if: steps.has_compliance.outputs.present == 'true'
        run: npm --prefix compliance ci --ignore-scripts
      - if: steps.has_compliance.outputs.present == 'true'
        run: npm --prefix compliance run lint
      - if: steps.has_compliance.outputs.present == 'true'
        run: npm --prefix compliance test
      - name: Load-test unit tests and type check
        if: steps.has_compliance.outputs.present == 'true'
        run: |
          if [ ! -f loadtest/package.json ]; then echo 'No loadtest package in this commit.'; exit 0; fi
          node compliance/node_modules/typescript/bin/tsc -p loadtest/tsconfig.json
          node scripts/run-tests.mjs loadtest/test/*.test.ts
      - if: steps.has_compliance.outputs.present == 'true'
        run: node compliance/src/cli.ts validate
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.has_compliance.outputs.present == 'true'
        with:
          pattern: test-report-*
          path: compliance/out/reports
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.has_compliance.outputs.present == 'true' && needs.release-content.result == 'success'
        with:
          name: vsix-${{ github.sha }}
          path: compliance/out/vsix
      - name: Download the newest successful main evidence bundle when one exists
        if: steps.has_compliance.outputs.present == 'true' && (github.event_name == 'pull_request' || steps.has_compliance.outputs.publish_as == 'main')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id="$(gh run list --workflow ci.yml --branch main --event push --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          if [ -n "$run_id" ]; then gh run download "$run_id" --name compliance-bundle --dir compliance/out/previous || true; fi
      - name: Write collector inputs and changed paths
        if: steps.has_compliance.outputs.present == 'true'
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
          PUBLISH_AS: ${{ steps.has_compliance.outputs.publish_as }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          VSIX_RESULT: ${{ needs.release-content.result }}
        run: |
          mkdir -p compliance/out
          printf '%s\n' "$NEEDS_JSON" > compliance/out/needs.json
          if [ "$EVENT" = "pull_request" ]; then git diff --name-only "$PR_BASE...$COMMIT" > compliance/out/changed.txt; else git diff-tree --no-commit-id --name-only -r "$COMMIT" > compliance/out/changed.txt; fi
          node --input-type=module -e '
            import { existsSync, readdirSync, statSync, writeFileSync } from "node:fs";
            import { openZip } from "./scripts/lib/zip.mjs";
            const reported = ["root", "relay", "hub"];
            if (existsSync("workbench/package.json")) reported.push("workbench");
            if (existsSync("deploy/test")) reported.push("deploy");
            const reports = reported.map(packageName => ({ package: packageName, file: `compliance/out/reports/test-report-${packageName}.ndjson` }));
            const collectors = {
              tests: { reports }, ci: { needsFile: "compliance/out/needs.json" },
              documents: { repoRoot: "." }, crypto: { repoRoot: "." },
              deployment: { file: "compliance/site-evidence/reference.json", signersFile: "compliance/attestations/site-signers.json" }
            };
            if (process.env.VSIX_RESULT === "success") {
              const directory = "compliance/out/vsix";
              const installers = readdirSync(directory, { withFileTypes: true }).filter(item => item.isFile() && item.name.endsWith(".vsix"));
              if (installers.length !== 1) throw new Error("Expected one installer from the successful build for this commit");
              const installer = `${directory}/${installers[0].name}`;
              if (statSync(installer).size > 14 * 1024 * 1024) throw new Error("The installer exceeds the release size budget");
              const file = "compliance/out/vsix-sbom.cdx.json";
              writeFileSync(file, openZip(installer, { maxEntryBytes: 1_048_576 }).read("extension/sbom.cdx.json"));
              collectors.sbom = { sboms: [{ subject: "vsix", file }], retainVsix: true };
            }
            if (process.env.PUBLISH_AS) Object.assign(collectors, { audit: { audits: [{ package: "root", file: "compliance/out/audit-root.json" }] }, "secret-scan": { jsonFile: "compliance/out/secret-scan.json" } });
            const value = { repository: process.env.REPOSITORY, commit: process.env.COMMIT, kind: process.env.PUBLISH_AS || "pr", repoRoot: ".", collectors };
            writeFileSync("compliance/out/inputs.json", JSON.stringify(value, null, 2));
          '
      - name: Record package audits for the release evidence bundle
        if: steps.has_compliance.outputs.publish_as != ''
        continue-on-error: true
        run: npm audit --json > compliance/out/audit-root.json
      - name: Scan tracked files for the release evidence bundle
        if: steps.has_compliance.outputs.publish_as != ''
        continue-on-error: true
        run: node scripts/secret-scan.mjs --json > compliance/out/secret-scan.json
      - name: Build this commit's evidence bundle
        if: steps.has_compliance.outputs.present == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          previous=""
          if [ -f compliance/out/previous/manifest.json ]; then previous="--previous compliance/out/previous"; fi
          node compliance/src/cli.ts bundle --inputs compliance/out/inputs.json --out compliance/out/bundle $previous
      - name: Write control-state changes to the job summary
        if: steps.has_compliance.outputs.present == 'true' && github.event_name == 'pull_request'
        env:
          FAIL_ON_DROP: ''
        run: |
          if [ -f compliance/out/previous/dashboard/dashboard.json ]; then
            node compliance/src/cli.ts pr-summary --pr-bundle compliance/out/bundle --main-dashboard compliance/out/previous/dashboard/dashboard.json --changed compliance/out/changed.txt --out compliance/out/pr-summary.md $FAIL_ON_DROP
            cat compliance/out/pr-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No earlier main evidence bundle was available for comparison.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Secret-scan the completed evidence bundle
        id: bundle_scan
        if: steps.has_compliance.outputs.publish_as != ''
        continue-on-error: true
        run: node scripts/secret-scan.mjs --dir compliance/out/bundle --json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.bundle_scan.outcome == 'success'
        with:
          name: compliance-bundle
          path: compliance/out/bundle
          retention-days: 30
          if-no-files-found: error
