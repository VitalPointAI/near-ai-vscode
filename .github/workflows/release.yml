# Builds and publishes a release when a v<x.y.z> tag is pushed (scripts/merge-pr.mjs tags the
# squash commit of a release/x.y.z PR; scripts/tag-release.mjs can retry it or tag a hotfix).
#
#   build    read-only token. Checks the tag, runs the tests, builds and verifies the VSIX, and
#            records its SHA-256 as a job output.
#   release  holds contents: write to create the GitHub release, so it installs and runs nothing:
#            it downloads the build's artifact, checks the checksum, and runs `gh release`.
#   publish  runs in the protected "marketplace" environment, so it waits until the owner
#            approves it in GitHub. It checks the VSIX checksum before anything else, installs
#            the vsce pinned in package-lock.json without install scripts, and publishes that
#            exact VSIX with the VSCE_PAT secret, which exists only in that environment.
name: Release

on:
  push:
    tags: ['v*.*.*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      vsix: ${{ steps.meta.outputs.vsix }}
      sha256: ${{ steps.checksum.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Check the tag matches package.json, CHANGELOG and main
        id: meta
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          name="$(node -p "require('./package.json').name")"
          if [ "$version" != "$pkg_version" ]; then
            echo "::error::Tag $TAG does not match package.json version $pkg_version"; exit 1
          fi
          # Release only commits that reached main through a PR, or the head of hotfix/<version>
          # when a hotfix is cut from an older tag (see docs/development-workflow.md).
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
             && [ "$(git rev-parse "origin/hotfix/$version" 2>/dev/null)" != "$GITHUB_SHA" ]; then
            echo "::error::$TAG points at a commit that is not on main or the head of hotfix/$version"; exit 1
          fi
          VERSION="$version" node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            import { changelogSection } from "./scripts/lib/workflow.mjs";
            const version = process.env.VERSION;
            const notes = changelogSection(readFileSync("CHANGELOG.md", "utf8"), version);
            if (!notes) { console.error(`::error::CHANGELOG.md has no "## ${version}" section`); process.exit(1); }
            writeFileSync("release-notes.md", notes);
          '
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "vsix=$name-$version.vsix" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - name: Run the tests
        run: npm test
      - name: Package the VSIX and check what it contains
        run: npm run verify:release
      - name: Record the VSIX checksum
        id: checksum
        env:
          VSIX: ${{ steps.meta.outputs.vsix }}
        run: |
          sum="$(sha256sum "$VSIX" | cut -d ' ' -f 1)"
          echo "$sum  $VSIX" | tee "$VSIX.sha256"
          echo "sha256=$sum" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-vsix
          path: |
            ${{ steps.meta.outputs.vsix }}
            ${{ steps.meta.outputs.vsix }}.sha256
            release-notes.md
          retention-days: 90
          if-no-files-found: error

  release:
    name: release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the GitHub release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-vsix
          path: release
      - name: Check the VSIX is the one the build job verified
        working-directory: release
        env:
          SHA256: ${{ needs.build.outputs.sha256 }}
          VSIX: ${{ needs.build.outputs.vsix }}
        run: echo "$SHA256  $VSIX" | sha256sum --check --strict
      - name: Create or update the GitHub release
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
          VSIX: ${{ needs.build.outputs.vsix }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$VSIX" "$VSIX.sha256" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --notes-file release-notes.md --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$VSIX" "$VSIX.sha256" --title "$VERSION" --notes-file release-notes.md --verify-tag --repo "$GITHUB_REPOSITORY"
          fi

  publish:
    name: publish
    needs: [build, release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Protected environment: the job waits here until the owner approves it in GitHub.
    environment:
      name: marketplace
      url: https://marketplace.visualstudio.com/items?itemName=VitalPoint.near-ai-vscode
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-vsix
          path: release
      - name: Check the VSIX is the one the build job verified
        working-directory: release
        env:
          SHA256: ${{ needs.build.outputs.sha256 }}
          VSIX: ${{ needs.build.outputs.vsix }}
        run: echo "$SHA256  $VSIX" | sha256sum --check --strict
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      # Only package.json and the lockfile are needed, to install the pinned vsce. The checkout
      # goes into its own folder so it cannot replace the verified VSIX.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: tools
      - name: Install the vsce version pinned in package-lock.json, without install scripts
        working-directory: tools
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Publish to the Visual Studio Marketplace
        working-directory: tools
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          VSIX: ${{ needs.build.outputs.vsix }}
        run: ./node_modules/.bin/vsce publish --packagePath "../release/$VSIX"
