# Builds and publishes a release when a v<x.y.z> tag is pushed (scripts/merge-pr.mjs tags the
# squash commit of a release/x.y.z PR; scripts/tag-release.mjs can retry it or tag a hotfix).
#
#   build    read-only token. Checks the tag (and that no release exists for it yet), runs the
#            tests, builds and verifies the VSIX, and records the SHA-256 of the VSIX and of the
#            release notes as job outputs. Dependency install scripts are disabled. The
#            checksums tie the later jobs' artifacts to this build's outputs.
#   image    builds and smoke-tests the Theia image with the verified VSIX inside it, and checks it
#            makes no outbound call (the workbench egress suite).
#   publish  pushes that exact image archive to GHCR after owner approval.
#   release  records the published digest, VSIX and compliance evidence on GitHub.
#
# Once the tag rulesets in docs/development-workflow.md are applied, only
# organization owners can create v* tags and nobody can move or delete them.
# The protected "container-release" environment (owner as required reviewer, v*.*.* tags only,
# no admin bypass) authorizes GHCR publication. The Marketplace is retired (owner, 2026-11-23).
# The image has no sign-in of its own: it runs behind Theia Cloud's sign-in, or locally on 127.0.0.1.
name: Release

on:
  push:
    tags: ['v*.*.*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      vsix: ${{ steps.meta.outputs.vsix }}
      evidence_branch: ${{ steps.meta.outputs.evidence_branch }}
      package_required: ${{ steps.meta.outputs.package_required }}
      sha256: ${{ steps.checksum.outputs.sha256 }}
      notes_sha256: ${{ steps.checksum.outputs.notes_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # The root suite launches the built hub with this pinned runtime. Use the same setup as CI.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: hashFiles('hub/package.json') != ''
        with:
          node-version: '26.13.1'
          cache: npm
          cache-dependency-path: hub/package-lock.json
      - name: Build the hub for the real-hub tests
        if: hashFiles('hub/package.json') != ''
        working-directory: hub
        run: |
          echo "NEAR_AI_HUB_NODE=$(command -v node)" >> "$GITHUB_ENV"
          npm ci --ignore-scripts
          npm run build
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Check the tag matches package.json, CHANGELOG and main, and is not released yet
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # A tag is released once. A moved or re-pushed tag must not replace a release's files.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::A GitHub release for $TAG already exists. Release tags are never reused; release the fix as the next patch version."; exit 1
          fi
          version="${TAG#v}"
          pkg_version="$(node -p "require('./package.json').version")"
          name="$(node -p "require('./package.json').name")"
          if [ "$version" != "$pkg_version" ]; then
            echo "::error::Tag $TAG does not match package.json version $pkg_version"; exit 1
          fi
          # Release only commits that reached main through a PR, or the head of hotfix/<version>
          # when a hotfix is cut from an older tag (see docs/development-workflow.md).
          evidence_branch=main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            if [ "$(git rev-parse --verify "refs/remotes/origin/hotfix/$version" 2>/dev/null)" != "$GITHUB_SHA" ]; then
              echo "::error::$TAG points at a commit that is not on main or the head of hotfix/$version"; exit 1
            fi
            evidence_branch="hotfix/$version"
          fi
          package_required=true
          if [ ! -f compliance/package.json ]; then
            # The documented hotfix path copies workflows onto old release tags. Only a hotfix
            # whose base predates the compliance package may omit its assessor package.
            if [ "$evidence_branch" = main ]; then
              echo '::error::compliance/package.json is required for a main release'; exit 1
            fi
            base="$(git merge-base "$GITHUB_SHA" origin/main || true)"
            if [ -z "$base" ] || git cat-file -e "$base:compliance/package.json" 2>/dev/null; then
              echo '::error::compliance/package.json is missing from the hotfix'; exit 1
            fi
            package_required=false
            echo '### Compliance package unavailable: this hotfix is based on a pre-compliance release.' >> "$GITHUB_STEP_SUMMARY"
          fi
          VERSION="$version" node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            import { changelogSection } from "./scripts/lib/workflow.mjs";
            const version = process.env.VERSION;
            const notes = changelogSection(readFileSync("CHANGELOG.md", "utf8"), version);
            if (!notes) { console.error(`::error::CHANGELOG.md has no "## ${version}" section`); process.exit(1); }
            writeFileSync("release-notes.md", notes);
          '
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "vsix=$name-$version.vsix" >> "$GITHUB_OUTPUT"
          echo "evidence_branch=$evidence_branch" >> "$GITHUB_OUTPUT"
          echo "package_required=$package_required" >> "$GITHUB_OUTPUT"
      - run: npm ci --ignore-scripts
      - name: Run the tests
        run: npm test
      - name: Package the VSIX and check what it contains
        run: npm run verify:release
      - name: Record the VSIX and release notes checksums
        id: checksum
        env:
          VSIX: ${{ steps.meta.outputs.vsix }}
        run: |
          sum="$(sha256sum "$VSIX" | cut -d ' ' -f 1)"
          echo "$sum  $VSIX" | tee "$VSIX.sha256"
          echo "sha256=$sum" >> "$GITHUB_OUTPUT"
          echo "notes_sha256=$(sha256sum release-notes.md | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-vsix
          path: |
            ${{ steps.meta.outputs.vsix }}
            ${{ steps.meta.outputs.vsix }}.sha256
            release-notes.md
          retention-days: 90
          if-no-files-found: error

  release:
    name: release
    needs: [build, package, attest, publish]
    if: >-
      ${{ !cancelled() && needs.build.result == 'success' && needs.attest.result == 'success' && needs.publish.result == 'success' &&
      ((needs.build.outputs.package_required == 'true' && needs.package.result == 'success') ||
      (needs.build.outputs.package_required == 'false' && needs.package.result == 'skipped')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the GitHub release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-vsix
          path: release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.build.outputs.package_required == 'true'
        with:
          name: compliance-package
          path: release
      - name: Check the VSIX and release notes are the ones the build job made
        working-directory: release
        env:
          SHA256: ${{ needs.build.outputs.sha256 }}
          NOTES_SHA256: ${{ needs.build.outputs.notes_sha256 }}
          VSIX: ${{ needs.build.outputs.vsix }}
          PACKAGE: ${{ needs.package.outputs.package }}
          PACKAGE_SHA256: ${{ needs.package.outputs.package_sha256 }}
          PACKAGE_REQUIRED: ${{ needs.build.outputs.package_required }}
        run: |
          printf '%s  %s\n%s  %s\n' "$SHA256" "$VSIX" "$NOTES_SHA256" release-notes.md | sha256sum --check --strict
          if [ "$PACKAGE_REQUIRED" = true ]; then
            printf '%s  %s\n' "$PACKAGE_SHA256" "$PACKAGE" | sha256sum --check --strict
          fi
      - name: Create the GitHub release
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
          IMAGE: ${{ needs.publish.outputs.image }}
          VSIX: ${{ needs.build.outputs.vsix }}
          PACKAGE: ${{ needs.package.outputs.package }}
          PACKAGE_REQUIRED: ${{ needs.build.outputs.package_required }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::A GitHub release for $TAG already exists; refusing to change it."; exit 1
          fi
          assets=("$VSIX" "$VSIX.sha256")
          if [ "$PACKAGE_REQUIRED" = true ]; then
            assets+=("$PACKAGE" "$PACKAGE.sha256")
          fi
          [[ "$IMAGE" =~ ^ghcr[.]io/[a-z0-9._/-]+@sha256:[a-f0-9]{64}$ ]]
          printf '\n## Sterling container image\n\n`%s`\n' "$IMAGE" >> release-notes.md
          printf '%s\n' "$IMAGE" > sterling-image.txt
          assets+=(sterling-image.txt)
          gh release create "$TAG" "${assets[@]}" --title "$VERSION" --notes-file release-notes.md --verify-tag --repo "$GITHUB_REPOSITORY"

  package:
    name: compliance package
    needs: build
    if: needs.build.outputs.package_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    outputs:
      package: ${{ steps.pack.outputs.package }}
      package_sha256: ${{ steps.pack.outputs.package_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: compliance/package-lock.json
      - run: npm --prefix compliance ci --ignore-scripts
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned oscal-cli
        run: |
          sh compliance/ci/install-tool.sh oscal-cli compliance/out/tools
          find compliance/out/tools -type f -name oscal-cli -printf '%h\n' >> "$GITHUB_PATH"
      - name: Download evidence from CI on the exact release commit
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ github.sha }}
          EVIDENCE_BRANCH: ${{ needs.build.outputs.evidence_branch }}
        run: |
          event=push
          if [ "$EVIDENCE_BRANCH" != main ]; then event=workflow_dispatch; fi
          run_id="$(gh run list --workflow ci.yml --branch "$EVIDENCE_BRANCH" --event "$event" --status success --commit "$COMMIT" --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          if [ -z "$run_id" ]; then echo '::error::No successful CI evidence run exists for this release commit'; exit 1; fi
          gh run download "$run_id" --name compliance-bundle --dir compliance/out/bundle
          gh run download "$run_id" --name relay-image-sbom --dir compliance/out/sbom
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { verifyManifest } from "./compliance/src/manifest.ts";
            const dir = "compliance/out/bundle";
            const result = verifyManifest(dir);
            const manifest = JSON.parse(readFileSync(`${dir}/manifest.json`, "utf8"));
            if (!result.ok || manifest.commit !== process.env.COMMIT) {
              throw new Error("CI evidence bundle must verify and match the release commit");
            }
          '
      - name: Include scheduled evidence for the exact release commit when available
        id: scheduled
        if: needs.build.outputs.evidence_branch == 'main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ github.sha }}
          REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          warn() {
            echo '::warning::Scheduled compliance evidence unavailable or unverified for this release commit; using the verified CI bundle.'
            echo 'Scheduled compliance evidence was unavailable or unverified for this release commit. The package uses the verified CI bundle.' >> "$GITHUB_STEP_SUMMARY"
          }
          if ! run_ids="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/compliance-scheduled.yml/runs" \
            -f branch=main -f head_sha="$COMMIT" -f status=success -F per_page=10 2>/dev/null |
            jq -r --arg commit "$COMMIT" --arg repo "$REPOSITORY_ID" '
              .workflow_runs | sort_by(.id) | reverse | .[] |
              select(.head_sha == $commit and .head_branch == "main" and .status == "completed" and .conclusion == "success"
                and (.event == "schedule" or .event == "workflow_dispatch")
                and (.repository.id | tostring) == $repo and (.head_repository.id | tostring) == $repo) |
              .id | select(type == "number" and . > 0 and . == floor)
            ' 2>/dev/null)"; then
            warn
            exit 0
          fi
          while IFS= read -r run_id; do
            [ -n "$run_id" ] || continue
            # Weekly jobs and suppressed uploads can leave a successful run without daily evidence.
            run_api="repos/$GITHUB_REPOSITORY/actions/runs/$run_id"
            if ! gh api --method GET "$run_api/jobs" -f filter=latest 2>/dev/null |
              jq -e --arg commit "$COMMIT" '
                any(.jobs[]; .name == "daily evidence" and .head_sha == $commit and .status == "completed" and .conclusion == "success"
                  and any(.steps[]; (.name | startswith("Run actions/upload-artifact@")) and .conclusion == "success"))
              ' >/dev/null 2>&1; then
              continue
            fi
            if ! gh api --method GET "$run_api/artifacts" -f name=compliance-bundle 2>/dev/null |
              jq -e '[.artifacts[] | select(.name == "compliance-bundle" and .expired == false)] | length == 1' >/dev/null 2>&1; then
              continue
            fi
            # Each transfer and merge gets a fresh directory. A failed attempt cannot replace CI evidence.
            if ! stage="$(mktemp -d compliance/out/scheduled-release.XXXXXX)"; then
              break
            fi
            if ! gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name compliance-bundle --dir "$stage/download" >/dev/null 2>&1; then
              continue
            fi
            if ! jq -n --arg repository "$GITHUB_REPOSITORY" --arg commit "$COMMIT" \
              '{repository: $repository, commit: $commit, kind: "release", repoRoot: ".", collectors: {}}' > "$stage/inputs.json"; then
              break
            fi
            run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run_id"
            if node compliance/src/cli.ts bundle --inputs "$stage/inputs.json" --out "$stage/combined" \
                --previous compliance/out/bundle --scheduled "$stage/download" --scheduled-run "$run_url" >/dev/null 2>&1 &&
                [ -s "$stage/combined/manifest.json" ]; then
              echo "bundle=$stage/combined" >> "$GITHUB_OUTPUT"
              printf 'The compliance package includes scheduled evidence from [run %s](%s).\n' "$run_id" "$run_url" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done <<< "$run_ids"
          warn
      - name: Resolve every level profile
        run: |
          mkdir -p compliance/out/resolved
          node --input-type=module -e 'import { stageAssessorItsg33Profile } from "./compliance/src/package.ts"; stageAssessorItsg33Profile(process.argv[1]);' compliance/out/assessor-oscal
          for profile in compliance/profiles/*.json; do
            name="$(basename "$profile")"
            if [ "$name" = itsg33-profile3.json ]; then profile="compliance/out/assessor-oscal/profiles/$name"; fi
            sh compliance/ci/oscal-validate.sh resolve "$profile" "compliance/out/resolved/$name"
          done
      - name: Build and validate the assessor package
        id: pack
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
          RELEASE_BUNDLE: ${{ steps.scheduled.outputs.bundle }}
        run: |
          node compliance/src/cli.ts package --release "$TAG" --bundle "${RELEASE_BUNDLE:-compliance/out/bundle}" --resolved compliance/out/resolved --sbom compliance/out/sbom/relay-image-sbom.json --out compliance/out/release
          directory="compliance/out/release/compliance-package-$TAG"
          sh compliance/ci/oscal-validate.sh package "$directory"
          package="compliance-package-$VERSION.tar.gz"
          tar -czf "compliance/out/release/$package" -C compliance/out/release "compliance-package-$TAG"
          sum="$(sha256sum "compliance/out/release/$package" | cut -d ' ' -f 1)"
          printf '%s  %s\n' "$sum" "$package" > "compliance/out/release/$package.sha256"
          echo "package=$package" >> "$GITHUB_OUTPUT"
          echo "package_sha256=$sum" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compliance-package
          path: |
            compliance/out/release/${{ steps.pack.outputs.package }}
            compliance/out/release/${{ steps.pack.outputs.package }}.sha256
          retention-days: 90
          if-no-files-found: error

  attest:
    name: attest release artifacts
    needs: [build, package]
    if: >-
      ${{ !cancelled() && needs.build.result == 'success' &&
      ((needs.build.outputs.package_required == 'true' && needs.package.result == 'success') ||
      (needs.build.outputs.package_required == 'false' && needs.package.result == 'skipped')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-vsix
          path: release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.build.outputs.package_required == 'true'
        with:
          name: compliance-package
          path: release
      - name: Verify the released subjects before attesting them
        working-directory: release
        env:
          VSIX: ${{ needs.build.outputs.vsix }}
          VSIX_SHA256: ${{ needs.build.outputs.sha256 }}
          PACKAGE: ${{ needs.package.outputs.package }}
          PACKAGE_SHA256: ${{ needs.package.outputs.package_sha256 }}
          PACKAGE_REQUIRED: ${{ needs.build.outputs.package_required }}
        run: |
          printf '%s  %s\n' "$VSIX_SHA256" "$VSIX" > subjects.sha256
          if [ "$PACKAGE_REQUIRED" = true ]; then
            printf '%s  %s\n' "$PACKAGE_SHA256" "$PACKAGE" >> subjects.sha256
          fi
          sha256sum --check --strict subjects.sha256
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: release/subjects.sha256

  trestle:
    name: Trestle import check
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: compliance-package
          path: release
      - name: Install the owner-approved Trestle wheel set
        run: |
          pip install --require-hashes --no-deps --only-binary=:all: -r compliance/ci/trestle-requirements.txt
      - name: Open the throwaway Trestle workspace
        run: mkdir trestle-work && cd trestle-work && trestle init
      - name: Import the component and assessor documents
        continue-on-error: true
        env:
          PACKAGE: ${{ needs.package.outputs.package }}
        run: |
          # Trestle refuses to import a file from inside its own workspace, so unpack beside it.
          mkdir trestle-input
          tar -xzf "release/$PACKAGE" -C trestle-input
          root="$(pwd)/trestle-input/$(tar -tzf "release/$PACKAGE" | head -1 | cut -d/ -f1)"
          cd trestle-work
          trestle import -f "$root/oscal/component-definitions/extension.json" -o extension >> "$GITHUB_STEP_SUMMARY" 2>&1
          trestle import -f "$root/oscal/ssp/protected-b.json" -o protected-b >> "$GITHUB_STEP_SUMMARY" 2>&1
          trestle import -f "$root/oscal/assessment-results.json" -o assessment-results >> "$GITHUB_STEP_SUMMARY" 2>&1
          trestle import -f "$root/oscal/poam.json" -o poam >> "$GITHUB_STEP_SUMMARY" 2>&1
      - name: Validate the Trestle workspace
        continue-on-error: true
        run: cd trestle-work && trestle validate -a >> "$GITHUB_STEP_SUMMARY" 2>&1

  image:
    name: Build and verify Sterling image
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      archive_sha256: ${{ steps.archive.outputs.sha256 }}
      image_id: ${{ steps.archive.outputs.image_id }}
      sbom_sha256: ${{ steps.sbom.outputs.sha256 }}
      cosign_sha256: ${{ steps.cosign.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-vsix
          path: verified-release
      - name: Build the release target with the verified extension
        env:
          VSIX: ${{ needs.build.outputs.vsix }}
          SHA256: ${{ needs.build.outputs.sha256 }}
          TAG: ${{ github.ref_name }}
        run: |
          (cd verified-release && printf '%s  %s\n' "$SHA256" "$VSIX" | sha256sum --check --strict)
          mkdir release-input
          cp "verified-release/$VSIX" release-input/sterling.vsix
          # The staff engine bundle takes the vendored Yjs from the verified extension; build-engine checks it against scripts/crdt-vendor.json.
          mkdir -p vendor/yjs vsix-yjs
          unzip -q release-input/sterling.vsix 'extension/vendor/yjs/*' -d vsix-yjs
          cp vsix-yjs/extension/vendor/yjs/yjs.cjs vsix-yjs/extension/vendor/yjs/LICENSES.txt vendor/yjs/
          bash .github/retry-registry-auth.sh docker build --target release --platform linux/amd64 --provenance=false --sbom=false \
            --file workbench/Dockerfile \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$TAG" \
            --tag "sterling-release:$TAG" .
      - name: Start Sterling and check the bundled extension
        env:
          TAG: ${{ github.ref_name }}
        run: |
          image="sterling-release:$TAG"
          test "$(docker image inspect --format '{{.Config.User}}' "$image")" = 10001:0
          docker run -d --name sterling-release-smoke -e STERLING_LISTEN_HOST=0.0.0.0 -e STERLING_PREVIEW_NO_SIGN_IN=accept -p 127.0.0.1::3000 "$image"
          trap 'docker logs sterling-release-smoke; docker stop sterling-release-smoke >/dev/null' EXIT
          address="$(docker port sterling-release-smoke 3000/tcp)"
          curl --fail --silent --show-error --retry 30 --retry-all-errors --retry-delay 2 \
            --max-time 5 "http://$address/" -o sterling-index.html
          grep -q 'bundle.js' sterling-index.html
          docker exec sterling-release-smoke test -s /plugins/extension/package.json
      - name: Save the tested image
        id: archive
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          docker save "sterling-release:$TAG" | gzip -1 > sterling-image.tar.gz
          echo "sha256=$(sha256sum sterling-image.tar.gz | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          echo "image_id=$(docker image inspect --format '{{.Id}}' "sterling-release:$TAG")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sterling-image
          path: sterling-image.tar.gz
          compression-level: 0
          retention-days: 90
          if-no-files-found: error
      # The release image's supply-chain record (D-31): its CycloneDX SBOM, which publish attests, and a Grype scan (report-only).
      # cosign is installed here, hash-checked against the repository pin, because publish holds a write token and checks out no code.
      - name: Install pinned Syft, Grype and cosign
        run: |
          sh compliance/ci/install-tool.sh syft compliance/out/tools
          sh compliance/ci/install-tool.sh grype compliance/out/tools
          sh compliance/ci/install-tool.sh cosign release-cosign
          echo "$PWD/compliance/out/tools" >> "$GITHUB_PATH"
      - name: Write the release image SBOM and record its checksum
        id: sbom
        env:
          TAG: ${{ github.ref_name }}
        run: |
          syft scan "sterling-release:$TAG" --output cyclonedx-json=sterling-image-sbom.cdx.json
          echo "sha256=$(sha256sum sterling-image-sbom.cdx.json | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Update the Grype database (report-only)
        continue-on-error: true
        run: grype db update
      - name: Record fixed high-severity findings in the release image (report-only)
        continue-on-error: true
        run: grype sbom:sterling-image-sbom.cdx.json --only-fixed --fail-on high --output json=sterling-image-scan.json
      - name: Record the pinned cosign for the publish job
        id: cosign
        run: |
          sum="$(node -p 'require("./compliance/ci/tool-pins.json").cosign.sha256')"
          printf '%s  %s\n' "$sum" release-cosign/cosign | sha256sum --check --strict
          echo "sha256=$sum" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sterling-image-sbom
          path: |
            sterling-image-sbom.cdx.json
            sterling-image-scan.json
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-cosign
          path: release-cosign/cosign
          retention-days: 1
          if-no-files-found: error
      # 46-03's no-egress proof against the archived image, last in the job: under the outbound recording hook it starts and restarts on a
      # network with no route out, and in Chromium, with no model servers set, the bundled NEAR AI chat opens and nothing calls out. It runs
      # after the archive is hashed and uploaded because the harness and Playwright's Chromium download run here with Docker access; the
      # image ID check ties the result to the archived image. Publish needs this job, so a failure still stops the release. The same
      # harness then runs the Get Started suite on that image, so the pages the owner reviewed (the rail, the work-area cards and pages, and
      # creating a work area through the bundled extension) cannot be missing from a release unnoticed.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.1'
      - name: Check the archived release image makes no outbound call and its Get Started pages work
        working-directory: workbench
        env:
          TAG: ${{ github.ref_name }}
          IMAGE_ID: ${{ steps.archive.outputs.image_id }}
        run: |
          npm ci --ignore-scripts
          npx --no-install playwright install --with-deps chromium
          node scripts/build.mjs
          test "$(docker image inspect --format '{{.Id}}' "sterling-release:$TAG")" = "$IMAGE_ID"
          WORKBENCH_TEST_IMAGE="sterling-release:$TAG" node ../scripts/run-tests.mjs --test-concurrency=1 dist/test/container/egress.test.js
          WORKBENCH_TEST_IMAGE="sterling-release:$TAG" node ../scripts/run-tests.mjs --test-concurrency=1 dist/test/container/get-started.test.js

  publish:
    name: Publish Sterling image
    needs: [build, package, attest, image]
    if: >-
      ${{ !cancelled() && needs.build.result == 'success' && needs.attest.result == 'success' &&
      needs.image.result == 'success' &&
      ((needs.build.outputs.package_required == 'true' && needs.package.result == 'success') ||
      (needs.build.outputs.package_required == 'false' && needs.package.result == 'skipped')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      packages: write
    environment:
      name: container-release
    outputs:
      image: ${{ steps.push.outputs.image }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sterling-image
      - name: Publish the verified image and record its registry digest
        id: push
        env:
          GHCR_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          SHA256: ${{ needs.image.outputs.archive_sha256 }}
          IMAGE_ID: ${{ needs.image.outputs.image_id }}
        run: |
          set -euo pipefail
          printf '%s  %s\n' "$SHA256" sterling-image.tar.gz | sha256sum --check --strict
          docker load --input sterling-image.tar.gz
          local_image="sterling-release:$TAG"
          test "$(docker image inspect --format '{{.Id}}' "$local_image")" = "$IMAGE_ID"
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          ref="$repository:$TAG"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io >/dev/null' EXIT
          if docker manifest inspect "$ref" > remote-manifest.json 2> registry-error.txt; then
            # An interrupted run can reuse this tag only for the same tested image; the check after
            # this block refuses any other image before the digest is recorded.
            docker pull "$ref"
            digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "$ref")"
          else
            if ! grep -Eqi 'manifest unknown|name unknown|no such manifest' registry-error.txt; then
              cat registry-error.txt >&2
              exit 1
            fi
            docker tag "$local_image" "$ref"
            docker push "$ref" | tee registry-push.txt
            digest="$repository@$(sed -nE 's/.*digest: (sha256:[a-f0-9]{64}) .*/\1/p' registry-push.txt | tail -1)"
          fi
          [[ "$digest" == "$repository"@sha256:* && "${digest##*@sha256:}" =~ ^[a-f0-9]{64}$ ]]
          # The registry copy must be the tested image. Docker's containerd image store reports the
          # manifest digest as the image ID; the classic store reports the config digest.
          if [ "${digest##*@}" != "$IMAGE_ID" ]; then
            docker manifest inspect "$digest" | jq -e --arg id "$IMAGE_ID" '.config.digest == $id'
          fi
          echo "image=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sterling-image-sbom
          path: sbom
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-cosign
          path: cosign-bin
      - name: Check the SBOM and cosign are the ones the image job recorded
        env:
          SBOM_SHA256: ${{ needs.image.outputs.sbom_sha256 }}
          COSIGN_SHA256: ${{ needs.image.outputs.cosign_sha256 }}
        run: |
          printf '%s  %s\n%s  %s\n' "$SBOM_SHA256" sbom/sterling-image-sbom.cdx.json "$COSIGN_SHA256" cosign-bin/cosign | sha256sum --check --strict
          chmod +x cosign-bin/cosign
          echo "$PWD/cosign-bin" >> "$GITHUB_PATH"
      # Key mode only (D-31, D-40; the flags in compliance/ci/TOOLS.md): your organization's key from this protected environment, an
      # empty signing config (no transparency log, no timestamp authority), never keyless. The key and its password reach this step only.
      - name: Sign the published digest and attest its SBOM with your organization's key, then verify both
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          GHCR_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.push.outputs.image }}
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "::error::Only a v<x.y.z> release tag signs the Sterling image; this run is for $GITHUB_REF."; exit 1; fi
          if [ -z "$COSIGN_PRIVATE_KEY" ]; then echo "::error::The container-release environment has no COSIGN_PRIVATE_KEY secret. Add your organization's cosign private key and its COSIGN_PASSWORD there, then re-run this job (the push above is reused)."; exit 1; fi
          [[ "$IMAGE" =~ ^ghcr[.]io/[a-z0-9._/-]+@sha256:[a-f0-9]{64}$ ]]
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io >/dev/null' EXIT
          cosign signing-config create --out "$RUNNER_TEMP/signing-config.json"
          cosign sign --key env://COSIGN_PRIVATE_KEY --signing-config "$RUNNER_TEMP/signing-config.json" -y "$IMAGE"
          cosign attest --key env://COSIGN_PRIVATE_KEY --signing-config "$RUNNER_TEMP/signing-config.json" --type cyclonedx --predicate sbom/sterling-image-sbom.cdx.json -y "$IMAGE"
          cosign public-key --key env://COSIGN_PRIVATE_KEY > "$RUNNER_TEMP/cosign.pub"
          cosign verify --key "$RUNNER_TEMP/cosign.pub" --insecure-ignore-tlog "$IMAGE" > /dev/null
          cosign verify-attestation --key "$RUNNER_TEMP/cosign.pub" --insecure-ignore-tlog --type cyclonedx "$IMAGE" > /dev/null
          fingerprint="$(openssl pkey -pubin -in "$RUNNER_TEMP/cosign.pub" -outform DER | sha256sum | cut -d ' ' -f 1)"
          printf '%s\n' '' '## Sterling image signed' '' "\`$IMAGE\`" '' "Signed, and its CycloneDX SBOM attested, with your organization's key (public key SHA-256 \`$fingerprint\`). Both verified." >> "$GITHUB_STEP_SUMMARY"
