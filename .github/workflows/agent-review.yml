# The `agent-review` gate, run automatically.
#
# Branch protection requires `agent-review`. Until this workflow existed the status only appeared when
# someone remembered to run `/review-pr` by hand, and the token that posted it lived on the same
# machine that authored the PR, so an author could certify their own work.
#
# Two triggers, both safe:
#   - workflow_run after CI succeeds. `workflow_run` runs in the base repository on the default
#     branch, so the workflow and the scripts come from `main`, never from the PR under review. A PR
#     cannot change the code that judges it, and cannot reach the token.
#   - workflow_dispatch, to re-review by hand (an unchanged head keeps its status, so this is for
#     re-running after a failure rather than after a push).
#
# The job sits in the protected `agent-review` environment, so the token exists only there and only
# after the owner approves that environment. The rest of the run happens as a different identity from
# the PR author, which is what makes the approval it posts count.
name: Agent review

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to review (empty reviews every open PR whose head lacks a passing status)
        required: false

concurrency:
  # One review per PR: a newer run supersedes the older one rather than racing it for the status.
  group: agent-review-${{ github.event.workflow_run.pull_requests[0].number || inputs.pr || 'all' }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write
  statuses: write

env:
  NODE_VERSION: '24'

jobs:
  review:
    name: agent-review
    # Only when CI actually passed: a PR whose tests fail has nothing to review, and the status must
    # not be posted success on a broken tree.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The token lives here and nowhere else, and this environment cannot be bypassed by admins.
    environment: agent-review
    steps:
      - name: Work out which PRs to review
        id: targets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRS: ${{ toJSON(github.event.workflow_run.pull_requests) }}
          REQUESTED: ${{ inputs.pr }}
        run: |
          set -euo pipefail
          if [ -n "${REQUESTED:-}" ]; then
            echo "numbers=${REQUESTED}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The workflow_run payload lists the PR a run belongs to. Fall back to asking which open PR
          # has this head, for a run started by a push rather than a pull request.
          numbers=$(printf '%s' "${PRS:-[]}" | node -e '
            let s = ""; process.stdin.on("data", d => s += d).on("end", () => {
              const list = JSON.parse(s || "[]");
              process.stdout.write(list.map(pr => pr.number).join(" "));
            });
          ')
          echo "numbers=${numbers}" >> "$GITHUB_OUTPUT"

      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The review runs the scripts from main, never from the PR being reviewed.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Review each target
        if: steps.targets.outputs.numbers != ''
        env:
          # Posts the status and the comment as the reviewer identity, which is not the PR author.
          GH_TOKEN: ${{ secrets.NEAR_AI_REVIEW_TOKEN }}
          SCRATCH: ${{ runner.temp }}
        run: |
          set -euo pipefail
          for pr in ${{ steps.targets.outputs.numbers }}; do
            out="${SCRATCH}/agent-review-${pr}"
            mkdir -p "$out"
            echo "== reviewing #${pr}"
            node scripts/agent-review.mjs gather "$pr" --out "$out"

            # A review needs judgement, so a model writes it. The prompt and the reply contract are
            # the same ones `.claude/commands/review-pr.md` uses, so a local review and a CI review
            # are produced the same way and judged by the same rules.
            node scripts/ci-review-prompt.mjs "$pr" --dir "$out" > "${out}/prompt.md"

            node scripts/ci-review-call.mjs "${out}/prompt.md" > "${out}/review.md"

            node scripts/agent-review.mjs submit "$pr" --review "${out}/review.md"
          done

      - name: Say so when there was nothing to review
        if: steps.targets.outputs.numbers == ''
        run: echo "No pull request was attached to this run, so nothing was reviewed."

  # A separate job, so the approval uses a token identity that is not the PR author's. GitHub refuses
  # an approval from the author, which is exactly why the author's own PASS never counted.
  approve:
    name: approve
    needs: review
    if: needs.review.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: agent-review
    steps:
      - name: Approve every PR whose agent-review passed
        env:
          GH_TOKEN: ${{ secrets.NEAR_AI_REVIEW_TOKEN }}
          PRS: ${{ toJSON(github.event.workflow_run.pull_requests) }}
          REQUESTED: ${{ inputs.pr }}
        run: |
          set -euo pipefail
          numbers="${REQUESTED:-}"
          if [ -z "$numbers" ]; then
            numbers=$(printf '%s' "${PRS:-[]}" | node -e '
              let s = ""; process.stdin.on("data", d => s += d).on("end", () => {
                const list = JSON.parse(s || "[]");
                process.stdout.write(list.map(pr => pr.number).join(" "));
              });
            ')
          fi
          for pr in $numbers; do
            # Only approve when the gate itself is green on the current head: branch protection
            # requires both, and an approval without the status would be a bypass.
            state=$(gh api "repos/${GITHUB_REPOSITORY}/commits/$(gh pr view "$pr" --json headRefOid --jq .headRefOid)/status" --jq '[.statuses[] | select(.context == "agent-review")][0].state // "none"')
            if [ "$state" != "success" ]; then
              echo "#${pr}: agent-review is ${state}, not approving"
              continue
            fi
            # --approve is a no-op when the reviewer already approved this commit.
            gh pr review "$pr" --approve --body "Approved by the agent review gate: \`agent-review\` passed on this commit. See the review comment above." \
              || echo "#${pr}: approval not created (already approved, or the PR is closed)"
          done
