{
  "note": {
    "about": "The site globals: one file per site, written by the site's operator from this example. It is JSON, which is also valid YAML, so the deploy scripts read it without a YAML library. Values files name a setting as ${site.<key>} (dotted for nested keys, for example ${site.clusterCidrs.pod}); a render stops with a plain message when a named setting is missing, and when a required setting (REQUIRED_SITE_SETTINGS in deploy/bundle/lib/render.mjs) is missing or empty: none has a silent default (D-11). Per-component site settings live in deploy/values/site.example/<release>.yaml.",
    "siteName": "A short name for this site, used in labels and messages, in lowercase letters, digits and dashes: it also names the site's exchange keys (exchange-receive-<siteName>, release-<siteName>).",
    "domain": "The site's parent domain; its host names (sessions, sign-in, registry) sit under it.",
    "rpId": "The WebAuthn relying-party ID (D-08): your organization's one shared parent domain of every site's host names. Chosen once for your organization's deployment and entered with the same value in every site file at HQ and at every edge site, never chosen per site, so a key registered at one site works at the others. No default is shipped.",
    "registry": "The host and port the site registry serves on (for example registry.site.example:5000). Every image is pulled from it by digest.",
    "registryKind": "zot (the lab and small sites) or harbor (HQ and large sites).",
    "clusterCidrs": "pod and service are the RKE2 defaults; nodes is the site's node network (required, no default).",
    "alertRecipients": "The email addresses, separated by commas, of your organization's security operators who receive the site's alerts (AU-5): audit shipping, OpenBao seal and audit device failures and the other rules of deploy/values/prometheus-alerts.yaml. Mail goes only through the site's own mail server (deploy/values/site.example/prometheus.yaml). Required: there is no default, so alerts never go nowhere (D-11).",
    "egressAllow": "The only addresses outside the cluster that pods may reach, each one something your organization's signed policy allows (for example the site mail server or an approved model endpoint), D-01. Empty means none.",
    "storageProvider": "longhorn installs the reference Longhorn release and its encrypted class (D-17); any other value (for example ceph or nfs) means the site supplies its own encrypted storage class, named in storageClass with storageEncryptionAtRest saying how; the install preflight (47-16) checks it.",
    "storageClass": "The storage class every workspace and data volume uses; it must be encrypted at rest (D-17).",
    "storageEncryptionAtRest": "How the class is encrypted at rest when it is not the reference Longhorn class (for example the array's own encryption for Ceph or NFS). Empty for Longhorn, whose class carries encrypted: \"true\".",
    "requestedStorage": "The size of each person's workspace volume (for example 10Gi). Required: there is no silent default (D-11).",
    "sessionTimeoutMinutes": "Idle minutes before a session is stopped; provisional until Phase 48 measures it (D-11).",
    "signInKeys": "The site's sign-in policy (D-57). passkeys accepts any WebAuthn passkey, including phone passkeys; hardware-only requires attested, allowlisted, device-bound hardware keys. passkeys is the default for development and the lab; hardware-only is recommended for production defence sites once they have keys.",
    "acceptableAaguids": "The approved hardware key models (AAGUIDs), used only under signInKeys hardware-only, where an empty list is refused (D-31).",
    "organizationPublicKey": "The PEM text (not a path) of your organization's cosign public key, which admission and the bundle import check every image and file against.",
    "stepUpAcr": "The level the realm asks for at step-up; the one source for the workbench's step-up setting, the realm's level-2 flow and OpenBao's step-up role.",
    "stepUpMaxAgeSeconds": "How recent a sign-in must be for a step-up action; the same one source as stepUpAcr.",
    "credentialIssuers": "The Keycloak subjects (user ids) of your organization's credential officers, named at the key ceremony (Phase 71, D-14). Only they may log in to OpenBao's jwt role sterling-issuer-stepup, after a step-up, to sign the site's status lists and deliver credentials. Who is an officer is set here only, never by a Keycloak group. Optional; empty means nobody can issue yet.",
    "exchangeOfficers": "The sign-in subjects (Keycloak user ids) of the people who may open objects partners send to your organization, named at the key ceremony (Phase 45.1, D-07). Only their step-up tokens can decrypt with the site's receiving key exchange-receive-<siteName>. Empty means nobody can. Never a group.",
    "releaseAuthorities": "The sign-in subjects (Keycloak user ids) of the release authorities who may bind exports to partners with your organization's release key release-<siteName>, named at the key ceremony (Phase 45.1, D-03). Only their step-up tokens can sign with it. Empty means nobody can. Never a group.",
    "crlExpiry": "How long the site intermediate's certificate revocation list stays valid (deploy/openbao/apply.mjs). It travels to edge sites as a signed file, so it must outlast the time media takes to arrive, or strict edge sites start refusing certificates. Optional; 720h (30 days) when unset.",
    "hubs": "The sync hubs this site runs, one item per hub: { name, publicAddress (the host name, with an optional :port, members computers use), nodePort (the TCP port on every node), storage (the state volume size) }. Each item becomes its own release (deploy/hub). Several hubs at HQ, each serving a set of projects (MUS 10.9).",
    "time": "The site's time settings (D-71; AU-8, AU-8(1), SC-45). A disconnected site has no internet time, so it must provide an on-site authoritative time source on the site network, either a GNSS-disciplined NTP appliance or a stratum-1 server (two or more recommended), never an internet pool. servers: its host names or IP addresses. refclocks: chrony reference clocks attached to a node, only \"PHC /dev/ptpN\", \"SHM N\" or \"SOCK /run/...\" with an optional \"poll N\" (the lab VM uses the KVM PTP clock, PHC /dev/ptp0). At least one of the two lists is required; the install refuses a site with neither. nts: true turns on Network Time Security for every server, trusting the site CA. maxClockErrorMs: the largest clock error bound a node or the import host may have, in milliseconds (AU-8(1), set by your organization; 1000 by default). Every node's chrony.conf is generated from these settings (deploy/bundle/lib/clock.mjs), and a node whose clock is not synchronised, follows its own local clock or is beyond the limit is not installed.",
    "recovery": "The site-wide recovery objectives (D-73, D-83; CP-2). rtoMinutes: the longest time to bring the whole site back in the recovery order. rpoMinutes: the most data any backup may lose. 480 and 1440 (8 and 24 hours) are your organization's accepted objectives (owner decision c, 2026-11-24) and the single source the system description reads. node deploy/bundle/drill.mjs plan compares every backup schedule with the RPO; a full-site drill compares its total time with the RTO (deploy/runbooks/recovery-plan.md).",
    "securityOfficers": "The Keycloak user ids (sub) of your organization's security officers at this site, named at the key ceremony (deploy/runbooks/key-ceremony.md), never a Keycloak group or claim. Only they, after a passkey step-up, may remove ended guests' secrets (OpenBao role guest-secrets-removal), and only they see the notice that some wait for removal (role security-officer-notices). Empty: nobody can, and the alert email still goes out (D-84)."
  },
