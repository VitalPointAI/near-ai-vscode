{
  "note": {
    "about": "Per-site realm settings, written by the site's operator from this example. JSON syntax (valid YAML) so deploy/keycloak/apply.mjs reads it without a YAML library; it may name site globals as ${site.<key>}. apply.mjs fills the realm's ${site.realm.<key>} tokens from it.",
    "eventsExpirationSeconds": "How long Keycloak keeps login events in its own database; the site log store keeps them longer (D-35).",
    "smtp": "The site's own mail server, which carries the passwordless registration link an administrator sends (D-33). A person can also enrol in person.",
    "redirectUris": "Where the sterling-sessions client may return after sign-in: the oauth2-proxy callback of every session host and the landing page.",
    "x509": "The optional smart-card sign-in (D-32), off by default. When enabled it becomes the browser flow; revocation is checked by a local OCSP responder or a CRL file refreshed on a schedule. webauthnRequired says whether the card is followed by a WebAuthn ceremony. The ingress must request and forward client certificates (47-13). The step-up level is not in this flow, so signing is refused while it is the browser flow.",
    "hqBroker": "Optional sign-in through HQ's Keycloak for an edge site linked to HQ (D-36), off by default. issuer is HQ's realm address (https://keycloak.<HQ domain>/realms/sterling) and clientId the client HQ registered for this site; the client secret goes in the Secret keycloak-hq-broker (key client-secret) in sterling-identity, never in this file. HQ's first sign-in only links the local person with the same email (people arrive by signed user export, deploy/keycloak/users.mjs) and never creates one. People keep signing in here with their own keys when the link is down, and signing always needs a fresh ceremony with a key registered here.",
    "guests": "Guest accounts for people from outside your organization who observe shared work (D-58 to D-63, deploy/keycloak/guests.mjs). Guests are off in this example (maxDays 0) and stay off until your organization runs a release that includes 71-12: the security contact issues each guest's credentials in their own session, and without it a guest holds none, so guests.mjs refuses to create or extend a guest while maxDays is above 0 on a release without it. maxDays: the longest a guest's end date may be from the moment it is set; 0 or absent turns guests off at this site. checkMinutes: how often, in whole minutes from 1 to 59, the automatic end (the CronJob sterling-guest-expiry, rendered only while maxDays is above 0) looks for guests past their end date. sessionsNamespace: the namespace of the Theia Cloud Session records, which ending a guest stops. retentionDays: how long an ended guest's records are kept (your organization's retention period); after it a security officer removes the guest's secrets in the workbench, and is reminded until they do (D-84).",
    "systemUseNotice": "Your organization's system use notice (D-76, AC-8), shown on every sign-in page, the administration console's included, before a person signs in. One text per language: en is required, any other language (a two-letter code, with an optional region such as fr-CA) is optional, and the person's browser or the language picker chooses. Plain text, with a blank line between paragraphs; markup is shown as typed, never run. Your organization sets the wording after legal review; the defaults below are a starting point."
  },
  "eventsExpirationSeconds": 7776000,
  "smtp": {
    "host": "mail.${site.domain}",
    "port": 587,
    "from": "sterling@${site.domain}"
  },
  "redirectUris": ["https://*.${site.domain}/oauth2/callback", "https://sessions.${site.domain}/*"],
  "x509": {
    "enabled": false,
    "revocation": "ocsp",
    "ocspResponderUri": "",
    "crlPath": "",
    "webauthnRequired": true
  },
  "hqBroker": {
    "enabled": false,
    "issuer": "",
    "clientId": ""
  },
  "guests": {
    "maxDays": 0,
    "checkMinutes": 15,
    "sessionsNamespace": "theia-cloud",
    "retentionDays": 365
  },
  "systemUseNotice": {
    "en": "This is a restricted system. Use it only if you are authorized, and only for purposes your organization's policies allow. Sign-in and activity on this system are recorded and may be monitored and audited, and records may be disclosed to authorized investigators as the law allows. Unauthorized use may lead to disciplinary or legal action. Personal information collected here is used to manage access and is handled under your organization's privacy notice.",
    "fr": "Ce système est à accès restreint. Utilisez-le seulement si vous y êtes autorisé, et uniquement aux fins permises par les politiques de votre organisation. Les connexions et l'activité sur ce système sont enregistrées et peuvent être surveillées et vérifiées, et les enregistrements peuvent être communiqués aux enquêteurs autorisés dans les limites permises par la loi. Toute utilisation non autorisée peut entraîner des mesures disciplinaires ou judiciaires. Les renseignements personnels recueillis ici servent à gérer l'accès et sont traités conformément à l'avis de confidentialité de votre organisation."
  }
}
