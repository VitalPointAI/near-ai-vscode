# Keycloak 26.8.2 (chart deploy/charts/vendored/keycloakx-7.4.0.tgz, which carries 26.8.1) on the official image (D-30, research Decision 10).
# The descriptor sets image.repository and image.digest to the official quay.io/keycloak/keycloak image from deploy/bundle/images.lock.json
# (D-20). It runs against the site Postgres (47-11) over verified TLS, serves HTTPS itself with a certificate from the site PKI (47-13), sits
# behind HAProxy, and writes JSON logs (events included) for the site log store (D-35). The realm itself is code (deploy/keycloak, 47-08).
# FIPS strict mode with BC-FIPS is not configured in Phase 47 (owner item E6, a condition on the register entry). Per-site settings are in
# deploy/values/site.example/keycloakx.yaml. The login theme sterling (ConfigMap sterling-login-theme from deploy/charts/sterling-keycloak-theme,
# installed just before) is mounted at /opt/keycloak/themes/sterling/login and shows your organization's system use notice on every sign-in
# page (D-76); the volume is not optional, so Keycloak does not start without the notice.
image:
  # Only the app.kubernetes.io/version label reads the tag; the image itself is pinned by digest.
  tag: "26.8.2"
  pullPolicy: IfNotPresent

# No database checker init container: its busybox image would be one more image to mirror; Keycloak's own readiness covers it.
dbchecker:
  enabled: false

# No helm test pod (it runs a Selenium Chromium image).
test:
  enabled: false

command: ["/opt/keycloak/bin/kc.sh"]
args: ["start"]

# Pod Security restricted (sterling-identity is not exempt). The root filesystem stays writable: kc.sh start builds into /opt/keycloak.
podSecurityContext:
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault
securityContext:
  runAsUser: 1000
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]

# URLs at the root (https://keycloak.<domain>/realms/sterling, the issuer OpenBao's jwt auth discovers, 47-07).
http:
  relativePath: "/"
  internalScheme: HTTPS

# Behind HAProxy: X-Forwarded-* headers, and no plain HTTP listener on the pod.
proxy:
  enabled: true
  mode: xforwarded
  http:
    enabled: false

database:
  vendor: postgres
  hostname: sterling-postgres.sterling-identity.svc
  port: 5432
  database: keycloak
  username: keycloak
  existingSecret: keycloak-db
  existingSecretKey: password

metrics:
  enabled: true
health:
  enabled: true

# signInKeys decides whether the vendor attestation roots are trusted (hardware-only) or not mounted (passkeys).
sterling:
  signInKeys: "${site.signInKeys}"
  attestationRootsConfigMap: ""

extraEnv: |
  - name: KC_HOSTNAME
    value: "https://keycloak.${site.domain}"
  - name: KC_HTTPS_CERTIFICATE_FILE
    value: /opt/keycloak/tls/tls.crt
  - name: KC_HTTPS_CERTIFICATE_KEY_FILE
    value: /opt/keycloak/tls/tls.key
  - name: KC_DB_URL_PROPERTIES
    value: "?sslmode=verify-full&sslrootcert=/opt/keycloak/site-ca/ca.crt"
  - name: KC_LOG_CONSOLE_OUTPUT
    value: json
  - name: KC_TRUSTSTORE_PATHS
    value: "/opt/keycloak/site-ca/ca.crt{{ if eq .Values.sterling.signInKeys "hardware-only" }},/opt/keycloak/attestation-roots{{ end }}"
  - name: KC_BOOTSTRAP_ADMIN_USERNAME
    valueFrom:
      secretKeyRef: { name: keycloak-admin-bootstrap, key: username, optional: true }
  - name: KC_BOOTSTRAP_ADMIN_PASSWORD
    valueFrom:
      secretKeyRef: { name: keycloak-admin-bootstrap, key: password, optional: true }

extraVolumes: |
  - name: site-ca
    configMap:
      name: sterling-site-ca
  - name: tls
    secret:
      secretName: keycloak-tls
      defaultMode: 0400
  - name: login-theme
    configMap:
      name: sterling-login-theme
      optional: false
  {{- if eq .Values.sterling.signInKeys "hardware-only" }}
  - name: attestation-roots
    configMap:
      name: {{ required "under signInKeys hardware-only, sterling.attestationRootsConfigMap (the vendor attestation roots from the bundled FIDO MDS snapshot) is required" .Values.sterling.attestationRootsConfigMap }}
  {{- end }}

extraVolumeMounts: |
  - name: site-ca
    mountPath: /opt/keycloak/site-ca
    readOnly: true
  - name: tls
    mountPath: /opt/keycloak/tls
    readOnly: true
  - name: login-theme
    mountPath: /opt/keycloak/themes/sterling/login
    readOnly: true
  {{- if eq .Values.sterling.signInKeys "hardware-only" }}
  - name: attestation-roots
    mountPath: /opt/keycloak/attestation-roots
    readOnly: true
  {{- end }}

# Sign-in at https://keycloak.<domain> through HAProxy (D-07, 47-13), with the certificate Keycloak itself serves (keycloak-tls from
# site-pki). HAProxy re-encrypts to Keycloak and verifies it against the site CA (Secret sterling-site-ca, key tls.crt, from
# deploy/charts/sterling-pki). It always overwrites the client-certificate headers with what it verified itself, so a header a browser sends is
# never passed on; they are empty unless the site turns smart cards on (deploy/values/site.example/kubernetes-ingress.yaml, D-32).
ingress:
  enabled: true
  ingressClassName: haproxy
  servicePort: https
  annotations:
    haproxy.org/server-ssl: "true"
    haproxy.org/server-ca: sterling-identity/sterling-site-ca
    # This list replaces the controller's (deploy/values/kubernetes-ingress.yaml), so it repeats the four forwarded headers.
    haproxy.org/request-set-header: |
      Client-Cert %[ssl_c_der,base64]
      Client-Cert-Chain %[ssl_c_chain_der,base64]
      X-Forwarded-For %[src]
      X-Forwarded-Host %[req.hdr(host)]
      X-Forwarded-Proto %[ssl_fc,iif(https,http)]
      X-Forwarded-Uri %[url]
  rules:
    - host: "keycloak.${site.domain}"
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - "keycloak.${site.domain}"
      secretName: keycloak-tls
