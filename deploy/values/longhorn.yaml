# Longhorn 1.13.0 (chart deploy/charts/vendored/longhorn-1.13.0.tgz), the settings that decide which images render. The descriptor sets each
# image's registry, repository and tag (<tag>@<digest>) from deploy/bundle/images.lock.json (D-17, D-20). Besides the image: lines, the chart
# passes the engine, instance manager, share manager, backing image manager and support bundle images to the manager as arguments and the CSI
# sidecar images to the driver deployer as environment; all come from the same lock. 47-16 adds the encrypted class and the rest of the
# settings here and must keep these.
image:
  pullPolicy: IfNotPresent

# Our encrypted class (deploy/charts/sterling-storage, 47-10) is the only class: the chart's own unencrypted default class is not created.
persistence:
  createStorageClass: false
  defaultClass: false
# FIPS mode: Longhorn's LUKS volumes use the host's cryptsetup. On a FIPS host keep the key derivation to PBKDF2 with the host's approved
# settings (CRYPTO_PBKDF and CRYPTO_PBKDF_FORCE_ITERATIONS in the longhorn-crypto Secret the install script writes) instead of argon2.
# The backup target and per-site sizes are in deploy/values/site.example/longhorn.yaml. Host packages (cryptsetup, open-iscsi, NFS client)
# must come from the site's own OS repository; the install preflight checks them (research Pitfall 12, 47-16).
