{{- /*
The realm applier (D-30, research Decision 10): keycloak-config-cli applies realm sterling from code at install and on every update, and
leaves what already agrees unchanged. Installed only by deploy/keycloak/apply.mjs, which checks the substituted realm first (checkRealm) and
passes it in with --set-file realm=...; the realm value is empty in a plain render. The applier signs in as a master-realm service-account
client (Secret keycloak-realm-applier), never as a person, and the sterling-sessions client secret reaches the realm only through the Job's
environment ($(env:STERLING_SESSIONS_CLIENT_SECRET) in the realm, keycloak-config-cli variable substitution), never through this chart.
*/ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: sterling-keycloak-realm
data:
  realm.json: {{ .Values.realm | default "{}" | quote }}
---
apiVersion: batch/v1
kind: Job
metadata:
  # One Job per realm content, so a changed realm is applied by a new Job and an unchanged one is not re-run.
  name: {{ printf "%s-%s" .Release.Name (.Values.realm | default "{}" | sha256sum | trunc 10) }}
  labels:
    app.kubernetes.io/name: sterling-keycloak-realm
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sterling-keycloak-realm
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: keycloak-config-cli
          image: {{ .Values.image | quote }}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: KEYCLOAK_URL
              value: {{ .Values.keycloakUrl | quote }}
            - name: KEYCLOAK_LOGINREALM
              value: master
            - name: KEYCLOAK_GRANTTYPE
              value: client_credentials
            - name: KEYCLOAK_CLIENTID
              valueFrom:
                secretKeyRef: { name: keycloak-realm-applier, key: client-id }
            - name: KEYCLOAK_CLIENTSECRET
              valueFrom:
                secretKeyRef: { name: keycloak-realm-applier, key: client-secret }
            - name: KEYCLOAK_AVAILABILITYCHECK_ENABLED
              value: "true"
            - name: KEYCLOAK_AVAILABILITYCHECK_TIMEOUT
              value: 300s
            - name: IMPORT_FILES_LOCATIONS
              value: /config/realm.json
            - name: IMPORT_VARSUBSTITUTION_ENABLED
              value: "true"
            # The site CA (ConfigMap sterling-site-ca, key truststore.p12, 47-13) is the only trusted root for the Keycloak URL.
            - name: JAVA_TOOL_OPTIONS
              value: "-Djavax.net.ssl.trustStore=/truststore/truststore.p12 -Djavax.net.ssl.trustStoreType=PKCS12 -Djava.io.tmpdir=/tmp"
            - name: STERLING_SESSIONS_CLIENT_SECRET
              valueFrom:
                secretKeyRef: { name: oauth2-proxy-secrets, key: client-secret }
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - { name: realm, mountPath: /config, readOnly: true }
            - { name: truststore, mountPath: /truststore, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: realm
          configMap:
            name: {{ .Release.Name }}
        - name: truststore
          configMap:
            name: sterling-site-ca
            items:
              - { key: truststore.p12, path: truststore.p12 }
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
