{{- /*
Who may connect to a person's session (Phase 46 finding, workbench/README.md "What Phase 47 closes"; 47-15). oauth2-proxy in each session
trusts X-Forwarded-* headers from the pod network (theia-cloud's sterling.trustedProxyIps), so only the HAProxy controllers and the Theia
Cloud operator (its activity monitor) may reach a session pod. Another person's session, or any other pod, cannot connect to it at all, so it
cannot send a forged X-Forwarded-Uri past oauth2-proxy's sign-in. Kubelet probes come from the node and are not affected.
Each source reaches one port: HAProxy only the oauth2-proxy sidecar, and the operator only the workbench's own port (its activity monitor,
through the session's -int Service). The workbench binds the pod IP as well as loopback (STERLING_LISTEN_HOST in our operator template), so
without the port rule HAProxy's namespace could reach the workbench past oauth2-proxy.
*/ -}}
{{- $a := .Values.appDefinition -}}
{{- $appPort := ternary .Values.labPlaceholder.port $a.port (eq ($a.usePlaceholder | toString) "true") -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sterling-session-ingress
spec:
  podSelector:
    matchLabels:
      sterling-session: "true"
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.sessionAccess.ingressNamespace }}
      ports:
        - protocol: TCP
          port: {{ .Values.sessionAccess.sidecarPort | int }}
    - from:
        - podSelector:
            matchLabels:
              app: operator
      ports:
        - protocol: TCP
          port: {{ $appPort | int }}
