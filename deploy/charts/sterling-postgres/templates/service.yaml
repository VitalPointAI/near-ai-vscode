apiVersion: v1
kind: Service
metadata:
  name: sterling-postgres
  labels:
    app.kubernetes.io/name: sterling-postgres
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: sterling-postgres
  ports:
    - { name: postgres, port: 5432, targetPort: postgres, protocol: TCP }
---
# The server certificate from the site PKI (47-13) for the name Keycloak connects to with sslmode=verify-full (47-08).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: sterling-postgres-tls
spec:
  secretName: sterling-postgres-tls
  issuerRef:
    kind: ClusterIssuer
    name: site-pki
  commonName: sterling-postgres.{{ .Release.Namespace }}.svc
  dnsNames:
    - sterling-postgres.{{ .Release.Namespace }}.svc
    - sterling-postgres.{{ .Release.Namespace }}.svc.cluster.local
  usages:
    - server auth
    - digital signature
    - key encipherment
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  duration: 2160h
  renewBefore: 720h
