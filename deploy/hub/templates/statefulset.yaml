{{- /*
One sync hub (D-42, D-43, MUS 10.1 and 10.9): a StatefulSet of exactly one replica with its own volume, because the hub's SQLite store must
never have two writers (research Pitfall 10); no autoscaler, and a rolling update of one replica stops the old pod before the new one starts.
The pod has the same hardening as the Compose service in relay/compose.yaml. The hub ends TLS itself; its four secret files come from Secret
hub-<name>-tls (cert-manager, site-pki-hub) and Secret hub-<name>-keys (the hub's own --generate-key output, kept in OpenBao
kv/apps/hubs/<name> and written by the install script), copied owner-only for the hub by the init container stage-secrets (G540).

Your organization's rules for the trust routes (Phase 71, 71-09 and 71-11): when the hub item names organizationPolicy (a ConfigMap or a Secret,
and the key holding the signed organization layer) and organizationKey (your organization's public key, base64url), the layer is mounted
read-only and both reach the hub as HUB_ORGANIZATION_POLICY and HUB_ORGANIZATION_KEY. Neither has a default: without both, the hub runs with
its trust routes off, and naming only one of them stops the render.
*/ -}}
{{- $i := .Values.instance -}}
{{- if not $i.name }}{{ fail "instance.name is not set" }}{{ end -}}
{{- if not $i.publicAddress }}{{ fail (printf "hub %s: publicAddress is not set in the site file" $i.name) }}{{ end -}}
{{- if not $i.storage }}{{ fail (printf "hub %s: storage is not set in the site file" $i.name) }}{{ end -}}
{{- if not .Values.image }}{{ fail "image is not set" }}{{ end -}}
{{- $org := $i.organizationPolicy | default dict -}}
{{- $trust := and $org $i.organizationKey -}}
{{- if and (or $org $i.organizationKey) (not $trust) }}{{ fail (printf "hub %s: organizationPolicy and organizationKey must be set together" $i.name) }}{{ end -}}
{{- if $trust }}
{{- if not $org.key }}{{ fail (printf "hub %s: organizationPolicy.key is not set" $i.name) }}{{ end -}}
{{- if eq (len (compact (list $org.configMap $org.secret))) 1 | not }}{{ fail (printf "hub %s: organizationPolicy names exactly one of configMap or secret" $i.name) }}{{ end -}}
{{- if not (regexMatch "^[A-Za-z0-9_-]{43}$" $i.organizationKey) }}{{ fail (printf "hub %s: organizationKey must be 43 base64url characters" $i.name) }}{{ end -}}
{{- end -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hub-{{ $i.name }}
  labels:
    app.kubernetes.io/name: sterling-hub
    app.kubernetes.io/instance: hub-{{ $i.name }}
spec:
  replicas: 1
  serviceName: hub-{{ $i.name }}
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/instance: hub-{{ $i.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sterling-hub
        app.kubernetes.io/instance: hub-{{ $i.name }}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      # The hub refuses a key file that group or others can read (hub/src/secrets.ts). The kubelet writes Secret files owned by root and, with
      # fsGroup set, makes each one at least 0440 whatever defaultMode says, so no Secret volume can give the hub's user an owner-only file
      # (G540). This container, the hub image's own Node as the hub's user, copies each file of the Secret volume into the memory volume
      # `secrets`, created 0400 and owned by that user (files/stage-secrets.cjs). The hub reads only those copies.
      initContainers:
        - name: stage-secrets
          image: {{ .Values.image | quote }}
          imagePullPolicy: IfNotPresent
          args: ["-e", {{ .Files.Get "files/stage-secrets.cjs" | toJson }}, "/run/secrets/hub-source", "/run/secrets/hub"]
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - { name: secret-files, mountPath: /run/secrets/hub-source, readOnly: true }
            - { name: secrets, mountPath: /run/secrets/hub }
      containers:
        - name: hub
          image: {{ .Values.image | quote }}
          imagePullPolicy: IfNotPresent
          args: ["/app/bin.mjs"]
          ports:
            - name: hub
              containerPort: 8443
              protocol: TCP
          env:
            - { name: HUB_HOST, value: "0.0.0.0" }
            - { name: HUB_PORT, value: "8443" }
            - { name: HUB_STATE_DIR, value: /var/lib/near-ai-hub }
            - { name: HUB_PUBLIC_ADDRESS, value: {{ $i.publicAddress | quote }} }
            - { name: HUB_TLS_CERT_FILE, value: /run/secrets/hub/tls.crt }
            - { name: HUB_TLS_KEY_FILE, value: /run/secrets/hub/tls.key }
            - { name: HUB_SIGNING_KEY_FILE, value: /run/secrets/hub/signing.key }
            - { name: HUB_ENCRYPTION_KEY_FILE, value: /run/secrets/hub/encryption.key }
            {{- if $trust }}
            - { name: HUB_ORGANIZATION_POLICY, value: /run/organization/organization.near-org-rules }
            - { name: HUB_ORGANIZATION_KEY, value: {{ $i.organizationKey | quote }} }
            {{- end }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            exec:
              command: ["/nodejs/bin/node", "/app/bin.mjs", "--healthcheck"]
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["/nodejs/bin/node", "/app/bin.mjs", "--healthcheck"]
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - { name: state, mountPath: /var/lib/near-ai-hub }
            - { name: secrets, mountPath: /run/secrets/hub, readOnly: true }
            - { name: tmp, mountPath: /tmp }
            {{- if $trust }}
            - { name: organization-policy, mountPath: /run/organization, readOnly: true }
            {{- end }}
      volumes:
        # The Secret files as the kubelet writes them: owned by root, group the pod's fsGroup (65532), 0440. Only stage-secrets mounts them.
        - name: secret-files
          projected:
            defaultMode: 0440
            sources:
              - secret:
                  name: hub-{{ $i.name }}-tls
                  items:
                    - { key: tls.crt, path: tls.crt }
                    - { key: tls.key, path: tls.key }
              - secret:
                  name: hub-{{ $i.name }}-keys
                  items:
                    - { key: signing, path: signing.key }
                    - { key: encryption, path: encryption.key }
        # The owner-only copies the hub reads, kept in memory like the Secret volume itself.
        - name: secrets
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        {{- if $trust }}
        # Your organization's signed rules (public, verified by the hub against organizationKey); read-only and group read (0440). The hub reads
        # them with no owner-only rule, as they hold no secret.
        - name: organization-policy
          {{- if $org.configMap }}
          configMap:
            name: {{ $org.configMap | quote }}
          {{- else }}
          secret:
            secretName: {{ $org.secret | quote }}
          {{- end }}
            defaultMode: 0440
            items:
              - { key: {{ $org.key | quote }}, path: organization.near-org-rules }
        {{- end }}
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
  volumeClaimTemplates:
    - metadata:
        name: state
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ .Values.storageClass | quote }}
        resources:
          requests:
            storage: {{ $i.storage | quote }}
